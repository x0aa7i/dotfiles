# Devices on the Tailscale network, by their default MagicDNS names.
# Included from ~/.ssh/config (install.sh adds the Include line). Pairing: ssh/README.md

# Phone (Termux sshd)
Host s21
  HostName s21
  Port 8022

# Fedora PC
Host fedora
  HostName fedora
  User abdo

Host s21 fedora
  # Keep the link alive on flaky mobile connections
  ServerAliveInterval 30
  ServerAliveCountMax 3
  # Reuse one connection for 10 min so later ssh/scp start instantly
  ControlMaster auto
  ControlPath ~/.ssh/sockets/%r@%h-%p
  ControlPersist 10m

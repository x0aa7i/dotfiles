[main]
term=xterm-256color
font=Lilex:size=13
pad=8x8 center-when-maximized-and-fullscreen
initial-window-mode=maximized
shell=herdr
workers=0

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[csd]
preferred=none                  # no titlebar / close buttons at all

[key-bindings]
clipboard-copy=Control+Insert
primary-paste=none
clipboard-paste=Shift+Insert

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return


# Tokyo Night

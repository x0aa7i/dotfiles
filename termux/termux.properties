# Termux settings - apply with `termux-reload-settings`

# Allow other apps (e.g. Tasker, Termux:Widget) to run commands
allow-external-apps = true

# Keyboard extra keys row
extra-keys = [ \
  ['ESC', '/', '-', 'HOME', 'UP', 'END', 'PGUP'], \
  ['TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'RIGHT', 'PGDN'] \
]
extra-keys-style = default

# Cursor
terminal-cursor-style = bar
terminal-cursor-blink-rate = 0

# Behaviour
bell-character = ignore
back-key = escape
use-black-ui = true
fullscreen = false
terminal-margin-horizontal = 4
terminal-transcript-rows = 5000


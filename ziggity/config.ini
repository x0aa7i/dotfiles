# Ziggity Configuration (~/.config/ziggity/config.ini)
# Documentation: https://github.com/simoarpe/ziggity

# Editor integration (from lazygit os.editPreset / editInTerminal)
editor_preset = nvim
editor_in_terminal = true
editor_command = nvim

# UI layout & panels (from lazygit gui.sidePanelWidth / expandFocusedSidePanel / showFileTree)
side_panel_width_percent = 30
expand_focused_side_panel = true
show_file_tree = true
collapse_status = false
staging_split = auto
diff_context = 3

# Commit guidelines & conventional commits
highlight_conventional_commits = true
commit_summary_limit = 50
commit_body_guide = 72
reword_on_amend = true

# Confirmation dialogs (from lazygit gui.skipDiscardChangeWarning)
skip_confirm.discard_all = false
skip_confirm.discard = false

# Colors & TokyoNight theme (brightened for high contrast & clarity)
# 13: TokyoNight Bright Purple / #b5a8ff (active border / accent)
# 60: TokyoNight Slate / #5f5f87 (inactive border)
# 7:  TokyoNight Foreground / #a9b1d6 (muted text, secondary labels, footer hints)
# 14: TokyoNight Bright Cyan / #a4daff (titles, diff hunks, footer shortcut keys)
# 12: TokyoNight Bright Blue / #8db0ff (diff headers)
# 11: TokyoNight Bright Yellow / #faba4a (hashes, tags, warnings)
# 2:  TokyoNight Green / #22d0a2 (staged / added changes)
# 1:  TokyoNight Red / #f7768e (unstaged / removed changes)
# 237: Dark Slate / #3a3a3a (selection background)
# 15: Bright White / #c0caf5 (selected foreground)
# 236: Dim Slate (inactive selected background)
color.active = 13
color.inactive_border = 60
color.muted = 7
color.title = 14
color.accent = 13
color.staged = 2
color.unstaged = 1
color.added = 2
color.removed = 1
color.warning = 11
color.hunk = 14
color.header = 12
color.hash = 11
color.tag = 11
color.footer = 7
color.footer_key = 14
color.selected_bg = 237
color.selected_fg = 15
color.inactive_selected_bg = 236
